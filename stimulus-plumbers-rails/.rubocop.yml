plugins:
  - rubocop-rake
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/RegexpLiteral:
  EnforcedStyle: percent_r

Style/HashSyntax:
  EnforcedShorthandSyntax: consistent

Style/Documentation:
  Enabled: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/BlockDelimiters:
  EnforcedStyle: line_count_based

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: false

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineHashBraceLayout:
  EnforcedStyle: new_line

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

Metrics/ClassLength:
  Exclude:
    - test/stimulus_plumbers/components/calendar/*/turbo/*_test.rb
    - test/stimulus_plumbers/form/*_test.rb
    - test/stimulus_plumbers/helpers/*_test.rb
    - test/stimulus_plumbers/plumber/*_test.rb
    - test/stimulus_plumbers/themes/**/*_test.rb

Metrics/MethodLength:
  Max: 15
  Exclude:
    - lib/stimulus_plumbers/components/calendar/*/turbo.rb
    - lib/stimulus_plumbers/components/calendar/*/turbo/*.rb
    - lib/stimulus_plumbers/components/combobox.rb
    - lib/stimulus_plumbers/components/combobox/**/*.rb
    - lib/stimulus_plumbers/components/date_picker/*.rb
    - lib/stimulus_plumbers/components/icon.rb
    - lib/stimulus_plumbers/form/builder.rb
    - lib/stimulus_plumbers/form/fields/*.rb
    - lib/stimulus_plumbers/helpers/*_helper.rb
    - lib/stimulus_plumbers/plumber/*.rb
    - lib/stimulus_plumbers/themes/**/*.rb
    - test/system/**/*_test.rb

Metrics/AbcSize:
  Exclude:
    - lib/stimulus_plumbers/components/calendar/**/*.rb
    - lib/stimulus_plumbers/components/date_picker/*.rb
    - lib/stimulus_plumbers/components/popover.rb
    - lib/stimulus_plumbers/form/builder.rb
    - lib/stimulus_plumbers/form/fields/*.rb
    - lib/stimulus_plumbers/themes/base.rb
    - lib/stimulus_plumbers/plumber/*.rb
    - test/system/**/*_test.rb

Layout/LineLength:
  Max: 130

Metrics/ParameterLists:
  Max: 6
  Exclude:
    - lib/stimulus_plumbers/components/combobox/trigger.rb
    - lib/stimulus_plumbers/components/combobox/popover.rb
    - lib/stimulus_plumbers/form/field.rb

Minitest/MultipleAssertions:
  Max: 8
  Exclude:
    - test/system/**/*_test.rb
