name: CI (snapshots)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate and update baseline screenshots
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix-browser:
    name: Read browser matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers-tailwind
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers-tailwind/package-lock.json

      - run: npm ci

      - id: read-matrix
        run: |
          matrix=$(bin/browser-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-snapshots-tailwind:
    name: "Snapshot tests / ${{ matrix.browser }}"
    needs: [matrix-browser]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers-tailwind
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/stimulus-plumbers-tailwind/Gemfile"
      DRIVER: ${{ matrix.browser }}
      PROJECTS: ${{ matrix.projects }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-browser.outputs.matrix) }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
        working-directory: stimulus-plumbers

      - run: npm run build
        working-directory: stimulus-plumbers

      - run: rm Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: latest
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers-tailwind/package-lock.json

      - run: npm ci

      - run: npx playwright install "$DRIVER" --with-deps

      - run: npm run build:css

      - name: Run snapshots (compare)
        if: ${{ !inputs.update_snapshots }}
        run: npm run test:snapshots -- $PROJECTS

      - name: Regenerate baselines
        if: ${{ inputs.update_snapshots }}
        run: npm run clean:snapshots && npm run test:snapshots:update -- $PROJECTS

      - name: Upload regenerated baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshots-tailwind-${{ matrix.browser }}
          path: stimulus-plumbers-tailwind/test/snapshots/__snapshots__/
          retention-days: 1

      - name: Upload Playwright report and snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-snapshots-${{ matrix.browser }}
          path: |
            stimulus-plumbers-tailwind/playwright-report/
            stimulus-plumbers-tailwind/test-results/
          retention-days: 7

  # One commit from all engines; parallel jobs would race pushing to the branch.
  commit-snapshots-tailwind:
    name: Commit snapshot baselines
    if: ${{ inputs.update_snapshots }}
    needs: [test-snapshots-tailwind]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - run: rm -rf stimulus-plumbers-tailwind/test/snapshots/__snapshots__

      - uses: actions/download-artifact@v8
        with:
          pattern: snapshots-tailwind-*
          merge-multiple: true
          path: stimulus-plumbers-tailwind/test/snapshots/__snapshots__

      - uses: ryancyq/github-signed-commit@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          files: stimulus-plumbers-tailwind/test/snapshots/__snapshots__
          commit-message: "chore: update snapshot baselines [skip ci]"
