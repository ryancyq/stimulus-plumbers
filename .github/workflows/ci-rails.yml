name: CI (Rails)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: read

jobs:
  matrix-rails-ruby:
    name: Define Rails matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: read-matrix
        run: echo "matrix=$(yq -o=json -I=0 '.' .github/matrix-rails-ruby.yml)" >> $GITHUB_OUTPUT

  test-rails:
    name: "Rails ${{ matrix.rails-version }} / Ruby ${{ matrix.ruby-version }}"
    needs: [matrix-rails-ruby]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby-version == 'head' || matrix.rails-version == 'edge' }}
    defaults:
      run:
        working-directory: stimulus-plumbers-rails
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/stimulus-plumbers-rails/gemfiles/rails_${{ matrix.rails-version }}.gemfile"
      COV_DIR: "coverage-rails-${{ matrix.rails-version }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-rails-ruby.outputs.matrix) }}
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

        # https://bundler.io/blog/2018/01/17/making-gem-development-a-little-better.html
      - run: rm Gemfile.lock
      - run: rm gemfiles/*.gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: latest
          bundler: latest
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
        working-directory: stimulus-plumbers

      - run: npm run build
        working-directory: stimulus-plumbers

      - run: "bundle exec appraisal rails-${{ matrix.rails-version }} rake coverage:run"

      - uses: actions/upload-artifact@v7
        with:
          name: "coverage-rails-${{ matrix.rails-version }}-ruby-${{ matrix.ruby-version }}"
          path: stimulus-plumbers-rails/coverage-rails-${{ matrix.rails-version }}
          include-hidden-files: true
          retention-days: 1

      - run: "bundle exec appraisal rails-${{ matrix.rails-version }} rake test:accessibility"

  test-rails-coverage:
    name: "CodeCov Rails ${{ matrix.rails-version }} / Ruby ${{ matrix.ruby-version }}"
    needs: [matrix-rails-ruby, test-rails]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby-version == 'head' || matrix.rails-version == 'edge' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-rails-ruby.outputs.matrix) }}
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: "coverage-rails-${{ matrix.rails-version }}-ruby-${{ matrix.ruby-version }}"
          path: stimulus-plumbers-rails/coverage-rails-${{ matrix.rails-version }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: stimulus-plumbers-rails/coverage-rails-${{ matrix.rails-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ruby
          fail_ci_if_error: true
