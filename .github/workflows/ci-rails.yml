name: CI (Rails)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

defaults:
  run:
    working-directory: stimulus-plumbers-rails

permissions:
  contents: read

jobs:
  test-rails:
    name: "Rails ${{ matrix.rails-version }} / Ruby ${{ matrix.ruby-version }}"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby-version == 'head' || matrix.rails-version == 'edge' }}
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/stimulus-plumbers-rails/gemfiles/rails_${{ matrix.rails-version }}.gemfile"
    strategy:
      fail-fast: false
      matrix:
        # Base: active rails × compatible rubies (no excludes needed)
        ruby-version:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
        rails-version:
          - "7.2"   # security support until Aug 2026; Ruby >= 3.1
          - "8.0"   # Ruby >= 3.2
          - "8.1"   # Ruby >= 3.2
        include:
          # Rails 7.2 also supports Ruby 3.1 (min for that release)
          - { rails-version: "7.2", ruby-version: "3.1" }
          # EOL rails — gemspec supports >= 6.1 with Ruby >= 3.0
          - { rails-version: "6.1", ruby-version: "3.0" }
          - { rails-version: "6.1", ruby-version: "3.1" }
          - { rails-version: "6.1", ruby-version: "3.2" }
          - { rails-version: "6.1", ruby-version: "3.3" }
          - { rails-version: "6.1", ruby-version: "3.4" }
          - { rails-version: "6.1", ruby-version: "4.0" }
          - { rails-version: "6.1", ruby-version: "head" }
          - { rails-version: "7.0", ruby-version: "3.0" }
          - { rails-version: "7.0", ruby-version: "3.1" }
          - { rails-version: "7.0", ruby-version: "3.2" }
          - { rails-version: "7.0", ruby-version: "3.3" }
          - { rails-version: "7.0", ruby-version: "3.4" }
          - { rails-version: "7.0", ruby-version: "4.0" }
          - { rails-version: "7.0", ruby-version: "head" }
          - { rails-version: "7.1", ruby-version: "3.0" }
          - { rails-version: "7.1", ruby-version: "3.1" }
          - { rails-version: "7.1", ruby-version: "3.2" }
          - { rails-version: "7.1", ruby-version: "3.3" }
          - { rails-version: "7.1", ruby-version: "3.4" }
          - { rails-version: "7.1", ruby-version: "4.0" }
          - { rails-version: "7.1", ruby-version: "head" }
          # Rails edge — bleeding edge
          - { rails-version: "edge", ruby-version: "3.3" }
          - { rails-version: "edge", ruby-version: "3.4" }
          - { rails-version: "edge", ruby-version: "4.0" }
          - { rails-version: "edge", ruby-version: "head" }

    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

        # https://bundler.io/blog/2018/01/17/making-gem-development-a-little-better.html
      - run: rm Gemfile.lock
      - run: rm gemfiles/*.gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: latest
          bundler: latest
          bundler-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
        working-directory: stimulus-plumbers

      - run: npm run build
        working-directory: stimulus-plumbers

      - run: "bundle exec appraisal rails-${{ matrix.rails-version }} rake test:unit"
      - run: "bundle exec appraisal rails-${{ matrix.rails-version }} rake test:system"
