name: CI (Stimulus)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: read

jobs:
  test-stimulus:
    name: Stimulus Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
      - run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-stimulus
          path: stimulus-plumbers/coverage
          include-hidden-files: true
          retention-days: 1

  test-stimulus-coverage:
    name: CodeCov Stimulus
    needs: [test-stimulus]
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: coverage-stimulus
          path: stimulus-plumbers/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: stimulus-plumbers/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: javascript
          fail_ci_if_error: true
