name: CI (MCP)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: read

jobs:
  test-mcp:
    name: "MCP / Ruby ${{ matrix.ruby-version }}"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby-version == 'head' }}
    defaults:
      run:
        working-directory: stimulus-plumbers-mcp
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/stimulus-plumbers-mcp/Gemfile"
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
        working-directory: stimulus-plumbers

      - run: npm run build
        working-directory: stimulus-plumbers

      - run: rm Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: latest
          bundler: latest
          bundler-cache: true

      - run: bundle exec rake coverage:run

      - uses: actions/upload-artifact@v7
        with:
          name: "coverage-mcp-ruby-${{ matrix.ruby-version }}"
          path: stimulus-plumbers-mcp/coverage
          include-hidden-files: true
          retention-days: 1

  test-mcp-coverage:
    name: "CodeCov MCP / Ruby ${{ matrix.ruby-version }}"
    needs: [test-mcp]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.ruby-version == 'head' }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.0"
          - "3.1"
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
          - "head"
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: "coverage-mcp-ruby-${{ matrix.ruby-version }}"
          path: stimulus-plumbers-mcp/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: stimulus-plumbers-mcp/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: mcp
          fail_ci_if_error: true
