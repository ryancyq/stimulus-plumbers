name: CI (browser)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: read

jobs:
  test-browser-tailwind:
    name: "Browser tests / Ruby ${{ matrix.ruby-version }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers-tailwind
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/stimulus-plumbers-tailwind/Gemfile"
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.4"
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
        working-directory: stimulus-plumbers

      - run: npm run build
        working-directory: stimulus-plumbers

      - run: rm Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: latest
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers-tailwind/package-lock.json

      - run: npm ci

      - run: npx playwright install chromium firefox webkit --with-deps

      - run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browser
          path: |
            stimulus-plumbers-tailwind/playwright-report/
            stimulus-plumbers-tailwind/test-results/
          retention-days: 7
