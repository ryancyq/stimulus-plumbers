name: CI (browser)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 5'

permissions:
  contents: read

jobs:
  matrix-browser:
    name: Read browser matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers-tailwind
    outputs:
      matrix: ${{ steps.read-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers-tailwind/package-lock.json

      - run: npm ci

      - id: read-matrix
        run: |
          matrix=$(bin/browser-matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-browser-tailwind:
    name: "Browser tests / ${{ matrix.browser }}"
    needs: [matrix-browser]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers-tailwind
    env:
      BUNDLE_GEMFILE: "${{ github.workspace }}/stimulus-plumbers-tailwind/Gemfile"
      DRIVER: ${{ matrix.browser }}
      PROJECTS: ${{ matrix.projects }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-browser.outputs.matrix) }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci
        working-directory: stimulus-plumbers

      - run: npm run build
        working-directory: stimulus-plumbers

      - run: rm Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: latest
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: stimulus-plumbers-tailwind/package-lock.json

      - run: npm ci

      - run: npx playwright install "$DRIVER" --with-deps

      - run: npm run test:browser -- $PROJECTS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-browser-${{ matrix.browser }}
          path: |
            stimulus-plumbers-tailwind/playwright-report/
            stimulus-plumbers-tailwind/test-results/
          retention-days: 7
