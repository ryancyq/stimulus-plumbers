name: Release
run-name: Release stimulus-plumbers ${{ inputs.version }}
concurrency:
  group: release
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.0.0)
        required: true
        type: string

env:
  VERSION: ${{ inputs.version }}

jobs:
  npm:
    name: Publish @stimulus-plumbers/controllers to NPM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stimulus-plumbers
    permissions:
      contents: write
      id-token: write
    environment: release
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: stimulus-plumbers/package-lock.json

      - run: npm ci

      - name: Build + publish
        run: bin/release ${{ env.VERSION }} --only npm --no-git
        working-directory: ${{ github.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: stimulus-plumbers-dist
          path: stimulus-plumbers/dist/

      - uses: orhun/git-cliff-action@v4
        with:
          config: stimulus-plumbers/cliff.toml
          args: --tag stimulus-plumbers/v${{ env.VERSION }}
        env:
          OUTPUT: stimulus-plumbers/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: ryancyq/github-signed-commit@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          files: |
            stimulus-plumbers/package.json
            stimulus-plumbers/package-lock.json
            stimulus-plumbers/CHANGELOG.md
          commit-message: "Bump npm @stimulus-plumbers/controllers version to ${{ env.VERSION }}"
          tag: stimulus-plumbers/v${{ env.VERSION }}

  rubygem-rails:
    name: Publish stimulus-plumbers to RubyGems
    runs-on: ubuntu-latest
    needs: npm
    defaults:
      run:
        working-directory: stimulus-plumbers-rails
    permissions:
      contents: write
      id-token: write
    environment: release
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: stimulus-plumbers-dist
          path: stimulus-plumbers-rails/app/assets/javascripts/stimulus-plumbers

      # Must precede setup-ruby --bundler-cache so bundle regenerates lockfiles
      - run: rm Gemfile.lock
      - run: rm gemfiles/*.gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler: 2.7.2
          bundler-cache: true

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build + publish
        run: bin/release ${{ env.VERSION }} --only rails --no-git
        working-directory: ${{ github.workspace }}

      - uses: orhun/git-cliff-action@v4
        with:
          config: stimulus-plumbers-rails/cliff.toml
          args: --tag stimulus-plumbers-rails/v${{ env.VERSION }}
        env:
          OUTPUT: stimulus-plumbers-rails/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: ryancyq/github-signed-commit@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          files: |
            stimulus-plumbers-rails/Gemfile.lock
            stimulus-plumbers-rails/gemfiles/*.gemfile.lock
            stimulus-plumbers-rails/lib/stimulus_plumbers/version.rb
            stimulus-plumbers-rails/CHANGELOG.md
          commit-message: "Bump rubygem stimulus-plumbers version to ${{ env.VERSION }}"
          tag: stimulus-plumbers-rails/v${{ env.VERSION }}

  rubygem-tailwind:
    name: Publish stimulus-plumbers-tailwind to RubyGems
    runs-on: ubuntu-latest
    needs: rubygem-rails
    defaults:
      run:
        working-directory: stimulus-plumbers-tailwind
    permissions:
      contents: write
      id-token: write
    environment: release
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Must precede setup-ruby --bundler-cache
      - run: rm Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler: 2.7.2
          bundler-cache: true

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build + publish
        run: bin/release ${{ env.VERSION }} --only tailwind --no-git
        working-directory: ${{ github.workspace }}

      - uses: orhun/git-cliff-action@v4
        with:
          config: stimulus-plumbers-tailwind/cliff.toml
          args: --tag stimulus-plumbers-tailwind/v${{ env.VERSION }}
        env:
          OUTPUT: stimulus-plumbers-tailwind/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: ryancyq/github-signed-commit@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          files: |
            stimulus-plumbers-tailwind/Gemfile.lock
            stimulus-plumbers-tailwind/lib/stimulus_plumbers/tailwind/version.rb
            stimulus-plumbers-tailwind/CHANGELOG.md
          commit-message: "Bump rubygem stimulus-plumbers-tailwind version to ${{ env.VERSION }}"
          tag: stimulus-plumbers-tailwind/v${{ env.VERSION }}

  rubygem-mcp:
    name: Publish stimulus-plumbers-mcp to RubyGems
    runs-on: ubuntu-latest
    needs: rubygem-tailwind
    defaults:
      run:
        working-directory: stimulus-plumbers-mcp
    permissions:
      contents: write
      id-token: write
    environment: release
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler: 2.7.2
          bundler-cache: true

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build + publish
        run: bin/release ${{ env.VERSION }} --only mcp --no-git
        working-directory: ${{ github.workspace }}

      - uses: ryancyq/github-signed-commit@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          files: |
            stimulus-plumbers-mcp/Gemfile.lock
            stimulus-plumbers-mcp/lib/stimulus_plumbers/mcp/version.rb
          commit-message: "Bump rubygem stimulus-plumbers-mcp version to ${{ env.VERSION }}"
          tag: stimulus-plumbers-mcp/v${{ env.VERSION }}
