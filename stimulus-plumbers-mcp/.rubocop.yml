plugins:
  - rubocop-rake
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/RegexpLiteral:
  EnforcedStyle: percent_r

Style/HashSyntax:
  EnforcedShorthandSyntax: consistent

Style/Documentation:
  Enabled: false

# Not published to RubyGems (run-from-clone dev tool), so MFA metadata is N/A.
Gemspec/RequireMFA:
  Enabled: false

Style/Alias:
  EnforcedStyle: prefer_alias_method

Style/BlockDelimiters:
  EnforcedStyle: line_count_based

Style/EndlessMethod:
  EnforcedStyle: disallow

Style/SingleLineMethods:
  AllowIfMethodIsEmpty: false

# Compact default conflicts with SingleLineMethods above.
Style/EmptyMethod:
  EnforcedStyle: expanded

Style/ClassMethodsDefinitions:
  Enabled: true
  EnforcedStyle: self_class

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: false

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

Layout/MultilineHashBraceLayout:
  EnforcedStyle: new_line

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

Metrics/MethodLength:
  Max: 15

Metrics/ClassLength:
  # ServerTest is a flat fixture, and ComponentSchema covers the most resources/tools of any
  # plugin — both track breadth, not per-method complexity (each method is already small).
  Exclude:
    - test/stimulus_plumbers/mcp/server_test.rb
    - lib/stimulus_plumbers/mcp/plugins/component_schema.rb

Layout/LineLength:
  Max: 130

Metrics/ParameterLists:
  Max: 6

Minitest/MultipleAssertions:
  Max: 8
